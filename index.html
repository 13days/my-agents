<script>
// IM entry points. A planned channel never receives an active configuration form.
const IM_CHANNELS = [
  { id: 'feishu', name: ['飞书 / Lark', 'Feishu / Lark'], available: true, description: ['机器人接入，支持私聊、群聊与话题', 'Bot access for private chats, groups and topics'] },
  { id: 'wecom', name: ['企业微信', 'WeCom'], available: false, description: ['预留渠道，适配器尚未接入', 'Planned channel; adapter not implemented yet'] },
];
let imSelectedChannel = localStorage.getItem('panel-im-channel') || 'feishu', imRenderRevision = 0;
if (!IM_CHANNELS.some(channel => channel.id === imSelectedChannel)) imSelectedChannel = 'feishu';
if (localStorage.getItem('panel-section') === 'feishu') localStorage.setItem('panel-section', 'im');
function isFeishuView() { return state.type === 'im' && imSelectedChannel === 'feishu'; }
function imHeader(data) {
  return viewHeading('im') + `<div class="im-channels" role="group" aria-label="${esc(rt('IM 渠道', 'IM channels'))}">${IM_CHANNELS.map(channel => {
    const status = !channel.available ? rt('尚未接入', 'Not available') : data?.phase === 'connected' ? rt('已连接', 'Connected') : rt('可接入', 'Available');
    return `<button type="button" class="im-channel" data-im-channel="${channel.id}" aria-pressed="${channel.id === imSelectedChannel}"><span class="im-channel-icon">${icon('chat')}</span><span class="im-channel-copy"><strong>${esc(rt(...channel.name))}</strong><small>${esc(rt(...channel.description))}</small></span><span class="im-channel-state${channel.available ? ' available' : ''}">${esc(status)}</span></button>`;
  }).join('')}</div>`;
}
function bindIMChannelControls() {
  document.querySelectorAll('[data-im-channel]').forEach(button => button.onclick = () => {
    imSelectedChannel = button.dataset.imChannel;
    localStorage.setItem('panel-im-channel', imSelectedChannel);
    writeRoute(); renderIMAccess();
  });
}
function prepareIMPage() {
  $('#empty').style.display = 'none'; $('#metabar').style.display = 'none';
  $('#render').classList.add('wide'); $('#render').style.display = 'block';
  $('#title').firstChild.textContent = rt('IM 接入', 'IM connections'); $('#fpath').textContent = '';
  $('#editBtn').disabled = $('#delBtn').disabled = true;
}
function imChannelError(message) {
  $('#render').innerHTML = imHeader() + `<section class="chart im-channel-placeholder" role="alert"><p>${esc(message)}</p><button type="button" class="btn" data-im-channel="feishu">${esc(rt('重试', 'Retry'))}</button></section>`;
  bindIMChannelControls();
}
async function renderIMAccess() {
  const revision = ++imRenderRevision;
  stopFeishuPolling(); prepareIMPage();
  if (imSelectedChannel === 'feishu') {
    $('#render').innerHTML = imHeader() + `<p class="route-muted im-loading">${esc(rt('正在读取飞书连接…', 'Loading Feishu connection…'))}</p>`;
    bindIMChannelControls();
    return renderFeishuGateway(revision);
  }
  $('#render').innerHTML = imHeader() + `<section class="chart im-channel-placeholder"><span class="im-channel-state">${esc(rt('尚未接入', 'Not available'))}</span><h2>${esc(rt('企业微信', 'WeCom'))}</h2><p>${esc(rt('企业微信适配器尚未实现，目前还不能配置或收发消息。', 'The WeCom adapter is not implemented. Configuration and messaging are not available yet.'))}</p><p class="route-muted">${esc(rt('当前可通过飞书 / Lark 使用会话、引擎、模型和任务管理。后续 IM 渠道将接入同一套工作空间。', 'Use Feishu / Lark for sessions, engines, models and tasks today. Future IM channels will connect to the same workspace.'))}</p><button type="button" class="btn" data-im-channel="feishu">${esc(rt('配置飞书 / Lark', 'Configure Feishu / Lark'))}</button></section>`;
  bindIMChannelControls();
}

const $ = s => document.querySelector(s);

const ICONS = {im: '<path d="M4 4h16v12H9l-5 4V4Z"/>', "terminal": "<path d=\"m5 6 6 6-6 6M13 18h6\"/>", "stats": "<path d=\"M4 19V5m0 14h16M8 15v-4m5 4V7m5 8v-6\"/>", "proxy": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"6\" rx=\"2\"/><rect x=\"3\" y=\"14\" width=\"18\" height=\"6\" rx=\"2\"/><path d=\"M7 7h.01M7 17h.01M12 10v4\"/>", "inspector": "<path d=\"M3 12h4l3-7 4 14 3-7h4\"/>", "sessions": "<path d=\"M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z\"/>", "voyage": "<path d=\"m3 17 9 4 9-4M5 15l7-3 7 3M12 3v9M12 3l7 6h-7M5 15v3m14-3v3\"/>", "commands": "<path d=\"m5 6 6 6-6 6M13 18h6\"/>", "skills": "<path d=\"m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z\"/>", "agents": "<rect x=\"4\" y=\"7\" width=\"16\" height=\"14\" rx=\"3\"/><path d=\"M12 3v4M8 12h.01M16 12h.01M9 17h6M1 12v5m22-5v5\"/>", "plugins": "<path d=\"M9 3v4m6-4v4M7 7h10v5a5 5 0 0 1-10 0V7Zm5 10v4\"/>", "workflows": "<rect x=\"8\" y=\"2\" width=\"8\" height=\"5\" rx=\"1\"/><rect x=\"2\" y=\"17\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"15\" y=\"17\" width=\"7\" height=\"5\" rx=\"1\"/><path d=\"M12 7v5M5.5 17v-5h13v5\"/>", "config": "<path d=\"M4 7h16M4 17h16M8 4v6m8 4v6\"/>", "chat": "<path d=\"M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z\"/>", "folder": "<path d=\"M3 8a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9H3V8Z\"/>", "arrow": "<path d=\"M5 12h14m-6-6 6 6-6 6\"/>"};
function icon(type) { return `<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[type] || ICONS.folder}</svg>`; }
// ---------- i18n lookup ----------
// One lookup for inline copy in every supported language: current language → en → zh.
function ui(zh, en, ja) { const copy = { zh, en, ja }; return copy[lang] ?? copy.en ?? copy.zh; }
// Older name kept for call sites (and feishu-ui.js); identical to ui().
function rt(zh, en, ja) { return ui(zh, en, ja); }

// ---------- engine registry ----------
// Engine metadata and capabilities come from GET /api/engines. UI code asks the
// registry (engineMeta / can / engineLabel) instead of testing engine ids.
const LEGACY_ENGINE = 'claude'; // sessions, captures and settings written before multi-engine support carry no engine id
const FALLBACK_ENGINES = { default: LEGACY_ENGINE, nodes: [], engines: [{ id: LEGACY_ENGINE, label: 'Claude Code', short: 'Claude', emblem: '✳', color: '#d97757', aliases: [], cli: null, default: true, nodes: [],
  capabilities: { sessionId: 'assigned', steer: 'inject', streamingText: true, reasoning: true, permissions: 'auto', accounts: true, images: true, resources: ['commands', 'skills', 'agents', 'plugins', 'workflows', 'config'], usage: { cost: true }, search: true, wrapped: true, capture: true } }] };
let ENGINES = [], ENGINE_DEFAULT = LEGACY_ENGINE, ENGINE_NODES = [], enginesLoaded = false;
function setEngines(data) {
  const list = Array.isArray(data?.engines) && data.engines.length ? data.engines : FALLBACK_ENGINES.engines;
  ENGINES = list.filter(engine => engine && typeof engine.id === 'string').map(engine => ({ ...engine, label: engine.label || engine.id, short: engine.short || engine.label || engine.id, emblem: engine.emblem || (engine.short || engine.id).charAt(0).toUpperCase(), color: engine.color || '', capabilities: engine.capabilities || {}, nodes: engine.nodes || [] }));
  ENGINE_DEFAULT = ENGINES.some(engine => engine.id === data?.default) ? data.default : (ENGINES.find(engine => engine.default) || ENGINES[0]).id;
  ENGINE_NODES = Array.isArray(data?.nodes) ? data.nodes : [];
}
setEngines(FALLBACK_ENGINES);
async function loadEngines() {
  try {
    const res = await fetch('/api/engines');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setEngines(await res.json()); enginesLoaded = true;
  } catch { setEngines(FALLBACK_ENGINES); enginesLoaded = false; }
}
function engineIds() { return ENGINES.map(engine => engine.id); }
function hasEngine(id) { return ENGINES.some(engine => engine.id === id); }
// Unknown ids (e.g. an engine removed since a session was recorded) still get a readable label.
function engineMeta(id) {
  const name = String(id || LEGACY_ENGINE);
  return ENGINES.find(engine => engine.id === name) || { id: name, label: name.charAt(0).toUpperCase() + name.slice(1), short: name.charAt(0).toUpperCase() + name.slice(1), emblem: name.charAt(0).toUpperCase(), color: '', capabilities: {}, nodes: [], cli: null, unknown: true };
}
function knownEngine(id, fallback = ENGINE_DEFAULT) { return hasEngine(id) ? id : fallback; }
function engineLabel(id, short = false) { const meta = engineMeta(id); return short ? meta.short : meta.label; }
// can(id, 'accounts'), can(id, 'usage.cost'), can(id, 'resources', 'skills'), can(id, 'steer', 'inject')
function can(id, path, value) {
  let current = engineMeta(id).capabilities;
  for (const key of path.split('.')) current = current?.[key];
  if (value !== undefined) return Array.isArray(current) ? current.includes(value) : current === value;
  return Array.isArray(current) ? current.length > 0 : !!current && current !== 'none';
}
function enginesWith(path, value) { return ENGINES.filter(engine => can(engine.id, path, value)); }
function engineClass(id) { return String(id || '').replace(/[^\w-]/g, ''); }
function engineStyle(id) { const color = engineMeta(id).color; return /^#[0-9a-f]{3,8}$/i.test(color) ? `--engine-color:${color}` : ''; }
function engineTag(id, text = engineLabel(id, true), className = 'tag engine-tag') {
  const tag = document.createElement('span'); tag.className = className + ' ' + engineClass(id); tag.textContent = text;
  const style = engineStyle(id); if (style) tag.setAttribute('style', style);
  return tag;
}
function engineEmblem(id) { return `<span class="engine-emblem ${engineClass(id)}" style="${engineStyle(id)}">${esc(engineMeta(id).emblem)}</span>`; }
// Engine-specific wording (file locations, login and capture setup differ per engine).
// Engines without an entry fall back to generic copy built from registry metadata.
const ENGINE_COPY = {
  claude: {
    connectionNote: ['多账号路由 · 故障转移', 'Account routing · Failover'],
    welcome: ['由本机 Claude Code 执行，有启用的代理账号时经账号路由；发出后会出现在左侧会话列表，之后可随时回来接续。', 'Runs on the local Claude Code CLI (through account routing when enabled). It appears in the session list so you can come back and continue.'],
  },
  codex: {
    connectionNote: ['本机登录 · 透传抓包', 'Local login · Request capture'],
    welcome: ['由本机 Codex CLI 执行，沿用你的 ChatGPT 订阅或 API Key 登录；开启抓包时请求经面板透传记录。发出后会出现在左侧会话列表，之后可随时回来接续。', 'Runs on the local Codex CLI with your ChatGPT subscription or API key login; with capture on, requests pass through the panel for inspection. It appears in the session list so you can come back and continue.'],
    replayCaptured: ['本会话的 Codex 请求已被抓取，下方显示实际捕获的提示词与工具。', 'Codex requests were captured. Captured prompts and tools appear below.'],
    replayNotCaptured: ['这个 Codex 会话没有可关联的抓包记录。请在「引擎与接入 → Codex」开启抓包；终端会话需先生成配置，并用 codex -p my-agents 启动。历史请求无法补抓。', 'No captured requests are linked to this Codex session. Enable capture in Engines & connections → Codex. For terminal sessions, install the profile and launch codex -p my-agents. Past requests cannot be captured retroactively.'],
    captureSetup: ['面板新建的 Codex 会话可在接入页开启抓包。终端使用前，请先生成抓包配置。', 'Enable capture for panel sessions in Connections. For terminal sessions, install the capture profile first.'],
    statsSource: ['数据来源：~/.codex/sessions · 输入包含缓存；订阅额度和 API 费用分别计算，不折算为 Claude 费用。', 'Source: ~/.codex/sessions · Input includes cached tokens. Subscription quotas and API billing are separate from Claude costs.'],
    resources: {
      skills: ['管理 Codex 的个人与项目技能，识别共享技能和只读安装项。', 'Manage personal and project Codex skills, including shared and installed skills.'],
      config: ['管理 Codex 的 AGENTS.md 指令与 config.toml 配置。', 'Manage Codex AGENTS.md instructions and config.toml settings.'],
      globalScope: ['全局（Codex + 共享技能）', 'Global (Codex + shared skills)'],
      installedNote: [' · 安装项或系统资源（只读）', ' · Installed or system resource (read-only)'],
      skillHint: scope => (scope ? scope + '/.agents/skills' : '~/.agents/skills') + '/<name>/SKILL.md',
      sharedSource: 'agents', installedReadOnly: true, bundle: false,
    },
  },
};
function engineCopy(id, key) { const copy = ENGINE_COPY[id]?.[key]; return Array.isArray(copy) ? ui(...copy) : copy; }

// Turn fetch failures into something a person can act on instead of "Failed to fetch".
function friendlyError(error, status) {
  if (error?.friendly) return error;
  if (error?.name === 'AbortError') return error;
  const code = status ?? error?.status;
  let message, network = false;
  if (!code && (error instanceof TypeError || /failed to fetch|networkerror|load failed|network ?error/i.test(error?.message || ''))) {
    network = true;
    message = typeof navigator !== 'undefined' && navigator.onLine === false
      ? ui('网络已断开，请检查网络连接后重试', 'You appear to be offline. Check your network connection and try again.', 'ネットワークに接続されていません。接続を確認して再試行してください。')
      : ui('无法连接面板服务，它可能正在重启，请稍后重试', 'Cannot reach the panel service. It may be restarting; try again shortly.', 'パネルサービスに接続できません。再起動中の可能性があります。しばらくしてから再試行してください。');
  } else if ([502, 503, 504].includes(code) && !error?.serverMessage) {
    message = ui(`面板服务暂不可用（HTTP ${code}），可能正在重启`, `Panel service unavailable (HTTP ${code}); it may be restarting`, `パネルサービスが利用できません（HTTP ${code}）。再起動中の可能性があります`);
  } else if (code >= 500) {
    message = ui(`服务器出错（HTTP ${code}）`, `Server error (HTTP ${code})`, `サーバーエラー（HTTP ${code}）`) + (error?.serverMessage ? '：' + error.serverMessage : '');
  } else if (error instanceof SyntaxError) {
    message = ui('服务器返回了无法识别的响应', 'The server returned an unreadable response', 'サーバーから解釈できない応答が返されました') + (code ? ` (HTTP ${code})` : '');
  } else message = error?.serverMessage || error?.message || String(error || ui('未知错误', 'Unknown error', '不明なエラー'));
  const friendly = new Error(message); friendly.friendly = true; friendly.status = code; friendly.network = network; friendly.retryable = network || [502, 503, 504].includes(code); friendly.cause = error;
  return friendly;
}
async function responseError(res) {
  const data = await res.json().catch(() => ({}));
  const error = new Error(data.error || res.statusText || 'HTTP ' + res.status); error.status = res.status; if (data.error) error.serverMessage = data.error;
  return friendlyError(error, res.status);
}

const pendingApiReads = new Map();
async function api(method, path, body) {
  const resource = isResourceType(path.split(/[/?]/)[0]);
  const q = 'lang=' + lang + (state.scope ? '&scope=' + encodeURIComponent(state.scope) : '') + (resource && state.resourceEngine !== defaultResourceEngine() ? '&engine=' + encodeURIComponent(state.resourceEngine) : '');
  const url = '/api/' + path + (path.includes('?') ? '&' : '?') + q;
  if (method === 'GET' && pendingApiReads.has(url)) return pendingApiReads.get(url);
  const request = (async () => {
    let res;
    try { res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined }); }
    catch (error) { throw friendlyError(error); }
    if (!res.ok) throw await responseError(res);
    try { return await res.json(); } catch (error) { throw friendlyError(error, res.status); }
  })();
  if (method !== 'GET') return request;
  pendingApiReads.set(url, request);
  try { return await request; } finally { pendingApiReads.delete(url); }
}

let listPage = { key: '', index: 0 };
const LIST_PAGE_SIZE = 80;
function renderList({ revealCurrent = false } = {}) {
  const kw = state.keyword.toLowerCase();
  const list = $('#list');
  const previousScroll = list.scrollTop;
  if (CAPS[state.type].dashboard) { list.replaceChildren(); return; }
  const fragment = document.createDocumentFragment();
  if (state.type === 'inspector') updateCaptureFilterCounts();
  const visibleItems = state.items
    .filter(it => matchOrigin(it))
    .filter(it => state.type !== 'sessions' || matchesSessionEngine(it))
    .filter(it => state.type !== 'inspector' || matchesCaptureFilters(it))
    .filter(it => !kw || it.name.toLowerCase().includes(kw) || (it.description || '').toLowerCase().includes(kw));
  const pageKey = JSON.stringify([state.type, state.resourceEngine, state.scope, state.origin, kw, sessionEngine, state.inspectorEngine, state.inspectorSession, state.inspectorPurpose]);
  const samePage = listPage.key === pageKey;
  if (!samePage) listPage = { key: pageKey, index: 0 };
  if (revealCurrent && state.current != null) {
    const currentIndex = visibleItems.findIndex(item => String(item.key || item.name) === String(state.current));
    if (currentIndex >= 0) listPage.index = Math.floor(currentIndex / LIST_PAGE_SIZE);
  }
  listPage.index = Math.max(0, Math.min(listPage.index, Math.ceil(visibleItems.length / LIST_PAGE_SIZE) - 1));
  const start = listPage.index * LIST_PAGE_SIZE, end = Math.min(visibleItems.length, start + LIST_PAGE_SIZE);
  if (!visibleItems.length) { const note = document.createElement('p'); note.className = 'list-empty'; note.textContent = kw ? ui('没有找到匹配的内容', 'No matching results') : ui('这里还没有内容', 'Nothing here yet'); fragment.append(note); }
  visibleItems.slice(start, end).forEach(it => {

      if (state.type === 'sessions') div.dataset.sid = String(key).toLowerCase();

      div.querySelector('.nm').textContent = prefix + it.name;
      if (state.type === 'inspector') {

        div.querySelector('.nm').appendChild(engineTag(state.resourceEngine, shared ? ui('共享', 'Shared', '共有') : engineLabel(state.resourceEngine, true)));

  if (!pager) { pager = document.createElement('div'); pager.id = 'list-pager'; pager.className = 'list-pager'; pager.setAttribute('aria-label', ui('列表分页', 'List pagination')); list.after(pager); }
  pager.replaceChildren(); pager.hidden = visibleItems.length <= LIST_PAGE_SIZE;
  if (!pager.hidden) {

    previous.type = next.type = 'button'; previous.textContent = '‹'; next.textContent = '›';

function editSession(item, action) {
  const id = item.key;
  if (chatView.run?.activeId && (chatView.sessionId === id || chatView.liveId === id)) { toast(rt('请先停止生成，再管理此会话', 'Stop generation before editing this session'), false); return; }
  const removing = action === 'delete';
  const dialog = document.createElement('dialog'); dialog.className = 'session-dialog';
  dialog.innerHTML = `<form><h3>${esc(removing ? rt('删除会话', 'Delete session') : rt('重命名会话', 'Rename session'))}</h3><p></p><input aria-label="${esc(rt('会话名称', 'Session name'))}" maxlength="80" required><div class="session-dialog-footer"><button type="button" class="btn">${esc(rt('取消', 'Cancel'))}</button><button type="submit" class="btn ${removing ? 'danger' : 'primary'}">${esc(removing ? rt('删除', 'Delete') : rt('保存', 'Save'))}</button></div><p class="session-dialog-error" role="alert"></p></form>`;
  dialog.querySelector('p').textContent = removing ? rt('从面板删除此会话？Claude CLI 的原始记录会保留。', 'Remove this session from the panel? The original Claude CLI records will be kept.') : rt('给这段对话起一个容易找到的名字。', 'Give this conversation a name that is easy to find.');
  const input = dialog.querySelector('input'); input.value = item.name; input.hidden = removing; input.required = !removing;
  const close = () => { dialog.close(); dialog.remove(); };
  dialog.querySelector('button[type="button"]').onclick = close;
  dialog.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dialog.querySelector('form').onsubmit = async e => {
    e.preventDefault(); const submit = dialog.querySelector('button[type="submit"]'); submit.disabled = true;
    try {
      const result = await api(removing ? 'DELETE' : 'PATCH', `sessions/${encodeURIComponent(id)}`, removing ? undefined : { title: input.value });
      if (removing) state.items = state.items.filter(it => it.key !== id);
      else { item.name = result.title; item.titleSource = 'manual'; const stored = state.items.find(it => it.key === id); if (stored) { stored.name = result.title; stored.titleSource = 'manual'; } }
      if (state.type === 'sessions') {

async function openItem(key, displayName) {

  closeExpandedWindow();
  if (state.type === 'inspector') return openInspect(key);
  if (state.type === 'sessions' && !state.sessionDetail && chatView.sessionId === key && chatView.run && $('#chat-messages')) return;
  chatAbort?.abort();
  // 会话默认打开为可接续的对话；“详情”按钮才走原来的说明页

  const view = state.sessionDetail ? 'detail' : '';
  state.sessionDetail = false;
  const revision = ++detailRevision;
  try {
    const type = state.type;

    const note = d.builtin ? t('noteBuiltin')

function renderDoc(d) {

      pre.textContent = r.systemPrompt;

      wrap.appendChild(det);

    // 🧰 抓包到的工具定义（含完整描述）
    if (r.toolDefs && r.toolDefs.length) {
      const det = document.createElement('details');
      det.style.marginBottom = '14px';
      const sum = document.createElement('summary');
      sum.textContent = t('insTools') + ' (' + r.toolDefs.length + ')';
      sum.style.cssText = 'cursor:pointer;font-weight:700;font-size:14px;color:var(--accent2);padding:6px 0';

function voyageHTML(d) {

    }

  }
  h += '</div>';
  h += `<div class="river-axis"><span>${esc(d.span.from)}</span><span>${esc(d.span.to)} →</span></div>`;

  // 故事线（航段）
  h += `<h3 style="font-size:13.5px;margin:22px 0 8px;color:var(--accent2)">🚩 ${esc(t('voyageLegs'))}</h3>`;
  for (const l of d.storylines) {
    h += `<details class="leg"><summary>
      <span class="legdot" style="background:${projColor(l.proj, d.projects)}"></span>
      <span class="leg-title">${esc(l.title)}</span>
      <span class="leg-meta">${esc(l.proj)} · ${l.from}→${l.to} · ${fmt(t('voyageLegMeta'), { s: l.sessionCount, d: l.days })}</span>

      </div>`;
    }
    h += '</div></details>';
  }
  return h;
}

let captureFind = null;
function findCaptureMatches(blocks, query) {

  }

  const update = () => {

    previous.disabled = next.disabled = !total; clear.disabled = !input.value;

// Reading view decodes JSON strings so prompts have real paragraphs and line breaks.
function formatCapturePayload(raw, mode = 'readable') {
  const source = String(raw ?? '');
  if (mode === 'raw') return source;
  let value;
  try { value = JSON.parse(source); }
  catch {
    const events = source.split(/\r?\n\r?\n/).filter(chunk => chunk.trim());
    if (!events.length || !events.every(chunk => /^(?:event:|data:|:)/m.test(chunk))) return source;
    value = events.map(chunk => {
      const data = chunk.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
      try { return JSON.parse(data); } catch { return data || chunk; }
    });
  }
  if (mode === 'json') return JSON.stringify(value, null, 2);
  const lines = [];
  const visit = (item, depth, label) => {
    const indent = '  '.repeat(depth);
    if (item !== null && typeof item === 'object') {
      const entries = Array.isArray(item) ? item.map((entry, i) => ['[' + i + ']', entry]) : Object.entries(item);
      lines.push(indent + label + (Array.isArray(item) ? ' [' + item.length + ']' : '') + (entries.length ? ':' : (Array.isArray(item) ? '' : ' {}')));
      for (const [key, child] of entries) visit(child, depth + 1, key);
    } else if (typeof item === 'string' && item.includes('\n')) {
      lines.push(indent + label + ':');
      for (const line of item.split('\n')) lines.push(indent + '  ' + line);
      lines.push('');
    } else lines.push(indent + label + ': ' + (typeof item === 'string' ? item : JSON.stringify(item)));
  };
  if (value !== null && typeof value === 'object') {
    for (const [key, child] of (Array.isArray(value) ? value.map((entry, i) => ['[' + i + ']', entry]) : Object.entries(value))) visit(child, 0, key);
    if (!lines.length) return JSON.stringify(value);
  } else return typeof value === 'string' ? value : JSON.stringify(value);
  return lines.join('\n');
}

// ---------- 轻量 Markdown 渲染 ----------
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = src.split(/\r?\n/);
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    // 代码块
    if (/^```/.test(l)) {
      const language = l.slice(3).trim().toLowerCase();
      let buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      const complete = i < lines.length;
      i++;
      const code = `<pre><code>${esc(buf.join('\n'))}</code></pre>`;
      html += language === 'mermaid' && complete
        ? `<section class="mermaid-block" data-mermaid-pending><div class="mermaid-toolbar"><span class="mermaid-status">图表</span><button type="button" class="mermaid-toggle" aria-expanded="false">查看源码</button></div><div class="mermaid-canvas" aria-label="Mermaid 图表"></div><div class="mermaid-source">${code}</div></section>`
        : code;
      continue;
    }
    // 表格
    if (l.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])) {
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      let t = '<table><thead><tr>' + cells(l).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].includes('|')) {
        t += '<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += t + '</tbody></table>';
      continue;
    }
    // 标题
    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    // 分割线
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { html += '<hr>'; i++; continue; }
    // 引用
    if (/^\s*>/.test(l)) {
      let buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      html += `<blockquote>${md(buf.join('\n'))}</blockquote>`;
      continue;
    }
    // 列表
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      let items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      html += `<${tag}>` + items.map(it => `<li>${inline(it)}</li>`).join('') + `</${tag}>`;
      continue;
    }
    // 空行
    if (!l.trim()) { i++; continue; }
    // 段落
    let buf = [l];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#|```|\s*([-*+]|\d+\.)\s|\s*>|\s*-{3,}\s*$)/.test(lines[i]) && !lines[i].includes('|')) {
      buf.push(lines[i]); i++;
    }
    html += `<p>${inline(buf.join(' '))}</p>`;
  }
  return html;
}

function pickBadge(d) {
  if (d.peakHour !== null && (d.peakHour >= 22 || d.peakHour <= 5) || d.lateNightMessages > 100) return t('bNight');
  if (d.activeDays > 0 && d.cost / d.activeDays > 30) return t('bBurner');
  if (d.streak >= 5) return t('bStreak');
  return t('bShip');
}

function rr(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawWrapped(d) {
  const cv = $('#wcanvas');
  const W = 1080, H = 1350, S = 2; // 2x 导出更清晰
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);
  const F = '-apple-system, "PingFang SC", "Hiragino Sans", sans-serif';
  const M = 'ui-monospace, "SF Mono", Menlo, monospace';

  // 背景：深色渐变 + 顶部品牌色光晕
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f1115'); g.addColorStop(1, '#191019');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, 160, 0, W / 2, 160, 560);
  rg.addColorStop(0, 'rgba(217,123,79,.16)'); rg.addColorStop(1, 'rgba(217,123,79,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, 720);

  // 头部
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8965f'; ctx.font = `700 30px ${F}`;
  ctx.fillText('⌘   C L A U D E   C O D E   W R A P P E D', W / 2, 98);
  const rangeLbl = d.days === 7 ? t('wR7') : d.days === 30 ? t('wR30') : t('rgAll');
  ctx.fillStyle = '#8b93a5'; ctx.font = `400 26px ${F}`;
  ctx.fillText(`${rangeLbl} · ${d.from} → ${d.to}`, W / 2, 146);

  // 主数字：花费
  ctx.fillStyle = '#ffffff'; ctx.font = `800 148px ${F}`;
  const hero = d.costKnown ? '$' + d.cost.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : fmtNum(d.tokens);
  ctx.fillText(hero, W / 2, 330);
  ctx.fillStyle = '#8b93a5'; ctx.font = `400 30px ${F}`;
  ctx.fillText(d.costKnown ? t('wSpent') : 'tokens', W / 2, 386);

  // 2×2 数据网格
  const tiles = [
    [fmtNum(d.sessions), t('wSessions')], [fmtNum(d.messages), t('wMessages')],
    [fmtNum(d.tokens), 'tokens'], [String(d.activeDays), t('wDays')],
  ];
  const tw = 470, th = 148, gap = 36, x0 = (W - tw * 2 - gap) / 2, y0 = 448;
  tiles.forEach((tl, i) => {
    const x = x0 + (i % 2) * (tw + gap), y = y0 + Math.floor(i / 2) * (th + 28);
    rr(ctx, x, y, tw, th, 20, '#171a21', '#2a2f3a');
    ctx.fillStyle = '#fff'; ctx.font = `700 52px ${F}`;
    ctx.fillText(tl[0], x + tw / 2, y + 70);
    ctx.fillStyle = '#8b93a5'; ctx.font = `400 24px ${F}`;
    ctx.fillText(tl[1], x + tw / 2, y + 112);
  });

  // 明细行
  const rows = [
    [t('wTopCmd'), d.topCommands[0] ? `/${d.topCommands[0][0]}  ×${d.topCommands[0][1]}` : '—'],
    [t('wTopModel'), d.topModel ? d.topModel.name : '—'],
    [t('wPeak'), d.peakHour !== null ? `${d.peakHour}:00 – ${d.peakHour + 1}:00` : '—'],
    [t('wStreak'), `${d.streak} ${t('wDaysUnit')}`],
  ];
  let ry = 880;
  rows.forEach(r => {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8b93a5'; ctx.font = `400 28px ${F}`;
    ctx.fillText(r[0], x0 + 6, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e6e9ef'; ctx.font = `700 32px ${M}`;
    ctx.fillText(r[1], W - x0 - 6, ry);
    ry += 72;
    ctx.strokeStyle = 'rgba(42,47,58,.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, ry - 44); ctx.lineTo(W - x0, ry - 44); ctx.stroke();
  });

  // 称号徽章
  ctx.textAlign = 'center';
  const badge = pickBadge(d);
  ctx.font = `700 34px ${F}`;
  const bw = Math.max(360, ctx.measureText(badge).width + 120);
  rr(ctx, W / 2 - bw / 2, 1176, bw, 78, 39, 'rgba(217,123,79,.14)', '#d97b4f');
  ctx.fillStyle = '#e8965f';
  ctx.fillText(badge, W / 2, 1228);

  // 页脚
  ctx.fillStyle = '#8b93a5'; ctx.font = `400 24px ${M}`;
  ctx.fillText('npx my-agents', W / 2, 1298);
  ctx.fillStyle = '#4a5160';
  ctx.fillText('github.com/13days/my-agents', W / 2, 1332);
}

function statsHTML(d) {
  let h = '';
  // Live 实时条
  h += `<div id="liveBar"><span class="dot"></span>
    <span><span class="lv">${esc(t('liveToday'))}</span> <b class="cost" id="lvCost">—</b></span>
    <span><span class="lv">${esc(t('liveBurn'))}</span> <b id="lvBurn">—</b></span>
    <span><span class="lv">${esc(t('liveActive'))}</span> <b id="lvAct">—</b></span>
    <span style="margin-left:auto"><span class="lv">${esc(t('liveBudget'))}</span> <input id="lvBudget" type="number" min="0" step="1"></span></div>`;
  // 概览卡片
  const days = d.dailyActivity || [];
  const cards = [
    [fmtNum(d.totalSessions), t('stTotalSessions')],
    [fmtNum(d.totalMessages), t('stTotalMessages')],
    [String(days.length), t('stActiveDays')],
    [(d.firstSessionDate || '').slice(0, 10) || '—', t('stSince')],
  ];
  h += '<div class="cards">' + cards.map(([v, k]) => `<div class="card"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join('') + '</div>';
  if (d.source === 'transcripts') h += `<div class="stats-source">${esc(t('stSource'))}</div>`;
  h += '<div class="stats-grid">';

  // 每日消息量，单一系列：单色 + 峰值直接标注 + 悬浮提示 + 时间范围切换
  const recent = statsRange ? days.slice(-statsRange) : days;
  if (recent.length) {
    const max = Math.max(...recent.map(x => x.messageCount), 1);
    const maxIdx = recent.findIndex(x => x.messageCount === max);
    const ranges = [[14, t('rg14')], [42, t('rg42')], [90, t('rg90')], [0, t('rgAll')]];
    h += `<div class="chart"><div class="chartHead"><h3>${esc(t('stDaily'))}</h3><div class="range">`
      + ranges.map(([v, lbl]) => `<button class="rangebtn${v === statsRange ? ' active' : ''}" data-range="${v}">${esc(lbl)}</button>`).join('')
      + `</div></div><div class="bars">`;
    recent.forEach((x, i) => {
      const pct = Math.max(2, Math.round(x.messageCount / max * 100));
      const tip = `${x.date} · ${x.messageCount.toLocaleString()} msg`;
      h += `<div class="b" style="height:${pct}%" data-tip="${esc(tip)}">${i === maxIdx ? `<span class="lbl">${fmtNum(max)}</span>` : ''}</div>`;
    });
    h += `</div><div class="axis"><span>${esc(recent[0].date)}</span><span>${esc(recent[recent.length - 1].date)}</span></div></div>`;
  }

  // 模型 token 用量（类别 = 身份，固定顺序取色，名称直接标注）
  const models = Object.entries(d.modelUsage || {})
    .map(([m, u]) => ({ m, v: (u.inputTokens || 0) + (u.outputTokens || 0) }))
    .filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v);
  if (models.length) {
    const shown = models.slice(0, 7);
    const rest = models.slice(7).reduce((s, x) => s + x.v, 0);
    if (rest > 0) shown.push({ m: t('stOther'), v: rest });
    const maxV = shown[0].v;
    h += `<div class="chart"><h3>${esc(t('stModels'))}</h3>`;
    shown.forEach((x, i) => {
      const pct = Math.max(1, Math.round(x.v / maxV * 100));
      const u = (d.modelUsage || {})[x.m];
      const tip = u ? `${x.m} · in ${u.inputTokens.toLocaleString()} · out ${u.outputTokens.toLocaleString()} · cache-r ${fmtNum(u.cacheReadInputTokens)} · cache-w ${fmtNum(u.cacheCreationInputTokens)}` : x.m + ' · ' + x.v.toLocaleString();
      h += `<div class="hbar-row" data-tip="${esc(tip)}">
        <div class="hbar-name">${esc(x.m)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div>
        <div class="hbar-val">${fmtNum(x.v)}</div></div>`;
    });
    h += '</div>';
  }

  // 24 小时活跃分布，单一系列
  const hours = Array.from({ length: 24 }, (_, i) => d.hourCounts?.[String(i)] || 0);
  const hmax = Math.max(...hours, 1);
  const hmaxIdx = hours.indexOf(hmax);
  h += `<div class="chart"><h3>${esc(t('stHours'))}</h3><div class="bars" style="height:80px">`;
  hours.forEach((v, i) => {
    const pct = Math.max(2, Math.round(v / hmax * 100));
    h += `<div class="b" style="height:${pct}%" data-tip="${i}:00 – ${i + 1}:00 · ${v.toLocaleString()}">${i === hmaxIdx ? `<span class="lbl">${fmtNum(hmax)}</span>` : ''}</div>`;
  });
  h += `</div><div class="axis"><span>0:00</span><span>12:00</span><span>23:00</span></div></div>`;

  // 使用排行：命令（来自 history，长期）+ 技能/智能体/工作流（来自 transcripts，约 30 天）
  const usage = d.usage || {};
  const rankChart = (title, entries) => {
    if (!entries.length) return '';
    const maxV = entries[0][1];
    let c = `<div class="chart"><h3>${esc(title)}</h3>`;
    entries.forEach(([name, v], i) => {
      const pct = Math.max(1, Math.round(v / maxV * 100));
      c += `<div class="hbar-row" data-tip="${esc(name + ' · ' + v.toLocaleString())}">
        <div class="hbar-name">${esc(name)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div>
        <div class="hbar-val">${v.toLocaleString()}</div></div>`;
    });
    return c + '</div>';
  };
  const top = obj => Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
  h += rankChart(t('stTopCommands'), top(usage.commands).map(([n, v]) => ['/' + n, v]));
  const mixed = [
    ...top(usage.skills).map(([n, v]) => [n + ' · ' + t('typeLabel')['skills'], v]),
    ...top(usage.agents).map(([n, v]) => [n + ' · ' + t('typeLabel')['agents'], v]),
    ...top(usage.workflows).map(([n, v]) => [n + ' · ' + t('typeLabel')['workflows'], v]),
  ].sort((a, b) => b[1] - a[1]).slice(0, 10);
  h += rankChart(t('stTopSkills'), mixed);

  // ccusage daily 风格的逐日明细表
  const rows = d.dailyTable || [];
  if (rows.length) {
    const num = n => `<td class="num">${n.toLocaleString()}</td>`;
    h += `<div class="chart"><h3>${esc(t('stTable'))}</h3><div style="overflow-x:auto"><table class="usage">`;
    h += `<thead><tr><th>${esc(t('thDate'))}</th><th>${esc(t('thModels'))}</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache Create</th><th class="num">Cache Read</th><th class="num">Total Tokens</th><th class="num">Cost (USD)</th></tr></thead><tbody>`;
    for (const r of rows) {
      h += `<tr><td>${esc(r.date)}</td><td>${r.models.map(m => '- ' + esc(m)).join('<br>')}</td>`
        + num(r.input) + num(r.output) + num(r.cacheCreate) + num(r.cacheRead) + num(r.totalTokens)
        + `<td class="num">$${r.cost.toFixed(2)}${r.costKnown ? '' : ' *'}</td></tr>`;
    }
    const tt = d.totals || {};
    h += `<tr class="total"><td>${esc(t('totalRow'))}</td><td></td>`
      + num(tt.input || 0) + num(tt.output || 0) + num(tt.cacheCreate || 0) + num(tt.cacheRead || 0) + num(tt.totalTokens || 0)
      + `<td class="num">$${(tt.cost || 0).toFixed(2)}${tt.costKnown ? '' : ' *'}</td></tr>`;
    h += `</tbody></table></div><div style="font-size:11.5px;color:var(--muted);margin-top:10px">${esc(t('stCostNote'))}</div></div>`;
  }
  return h + '</div>';
}

async function setLang(code) {
  if (!LANGS.some(l => l.code === code)) return;
  lang = code;
  localStorage.setItem('panel-lang', lang);
  applyLang();
  // 重新拉取本地化的列表与详情
  if (state.type === 'im') { await renderIMAccess(); return; }
  if (state.type === 'proxy') { await renderProxyTab(); return; }
  if (state.type === 'sessions' && $('#chat-messages') && !chatAbort) { chatView.sessionId ? openSessionChat(chatView.sessionId) : renderChat(); return; }
  if (state.type === 'voyage') { await renderVoyage(); return; }
  if (CAPS[state.type].dashboard) { await renderStatsTab(); loadCounts(); return; }
  const cur = state.current;
  const type = state.type;
  const { items } = await api('GET', type);
  if (state.type !== type) return;
  state.items = items;
  renderList();
  loadCounts();
  if (cur && !state.editing) openItem(cur);
}

let expandedWindow = null;
function closeExpandedWindow() {
  if (!expandedWindow) return;
  const { dialog, node, marker, focus, scrollTop, scrollLeft } = expandedWindow;
  expandedWindow = null;
  if (marker.isConnected) marker.replaceWith(node);
  node.classList.remove('is-expanded-window');
  node.scrollTop = scrollTop; node.scrollLeft = scrollLeft;
  dialog.close(); dialog.remove();
  if (focus?.isConnected) focus.focus({ preventScroll: true });
}
function expandWindow(node, focus) {
  closeExpandedWindow();
  const marker = document.createComment('expanded window');
  node.before(marker);
  const dialog = document.createElement('dialog'); dialog.className = 'expanded-dialog';
  dialog.setAttribute('aria-label', ui('放大窗口', 'Expanded window'));
  const bar = document.createElement('div'); bar.className = 'expanded-dialog-bar';
  const hint = document.createElement('span'); hint.textContent = ui('Ctrl / ⌘ + F 搜索全文', 'Ctrl / ⌘ + F to search');
  const close = document.createElement('button'); close.type = 'button'; close.className = 'btn';
  close.textContent = ui('收起 · Esc', 'Restore · Esc'); close.onclick = closeExpandedWindow;
  bar.append(hint, close);
  const content = document.createElement('div'); content.className = 'expanded-dialog-content';
  expandedWindow = { dialog, node, marker, focus, scrollTop: node.scrollTop, scrollLeft: node.scrollLeft };
  node.classList.add('is-expanded-window');
  content.append(node); dialog.append(bar, content); marker.before(dialog);
  dialog.addEventListener('cancel', e => { e.preventDefault(); closeExpandedWindow(); });
  dialog.showModal(); close.focus();
}
function addInlineExpansion(parent, content) {
  const button = document.createElement('button'); button.type = 'button'; button.className = 'btn content-expand';
  button.setAttribute('aria-expanded', 'false');
  const update = () => { button.textContent = ui(content.classList.contains('show-full-content') ? '收起全文' : '展开全文', content.classList.contains('show-full-content') ? 'Collapse text' : 'Expand text'); };
  content.setExpanded = open => { content.classList.toggle('show-full-content', open); button.setAttribute('aria-expanded', String(open)); update(); };
  button.onclick = () => content.setExpanded(!content.classList.contains('show-full-content'));
  parent.append(button); update();
}
function installWindowControls() {
  document.querySelectorAll('#render .mermaid-canvas, #render pre, #render .chart, #render .bubble, #render .chat-message, #render .capture-context, #render .chat-messages, #render .route-account, #render .card, #render .leg-sessions, #render .chat-tool, #render .route-empty, #render .account-usage-row, #render #river, #editor').forEach(node => {
    if (node.classList.contains('is-expanded-window') || node.windowExpandButton?.isConnected) return;
    node.dataset.expandable = 'true';
    let host = node;
    if (node.matches('pre, textarea')) {
      host = document.createElement('div'); host.className = 'expandable-text-window';
      node.before(host); host.append(node);
    }
    host.classList.add('expandable-window');
    const button = document.createElement('button'); button.type = 'button'; button.className = 'window-expand';
    button.textContent = '⛶'; button.title = ui('放大窗口', 'Expand window'); button.setAttribute('aria-label', button.title);
    button.onclick = e => { e.stopPropagation(); expandWindow(node, button); };
    host.append(button);
    node.windowExpandButton = button;
  });
}
const windowObserver = new MutationObserver(installWindowControls);
windowObserver.observe($('#render'), { childList: true, subtree: true });
installWindowControls();
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    const root = expandedWindow?.node || $('#render');
    root.querySelectorAll('details:not(.route-more)').forEach(node => { node.open = true; node.populateForSearch?.(); });
    root.querySelectorAll('pre, .capture-context').forEach(node => { if (node.setExpanded) node.setExpanded(true); else node.classList.add('show-full-content'); });
    // Keep native browser Find, including its match count and next/previous shortcuts.
  }
});

// ---------- 初始化 ----------
// Engines load first so pickers, tabs and capability checks reflect what the server actually runs.
(async () => {
  await loadEngines();
  const savedResource = localStorage.getItem('panel-resource-engine');
  state.resourceEngine = hasEngine(savedResource) && can(savedResource, 'resources') ? savedResource : defaultResourceEngine();
  statsEngine = knownEngine(statsEngine);
  if (sessionEngine !== 'all' && !hasEngine(sessionEngine)) sessionEngine = 'all';
  installPanelSelects();
  applyLang();
  restoreRoute();
  loadCounts();
  loadProjects();
})();
</script>
